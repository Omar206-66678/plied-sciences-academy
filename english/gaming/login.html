<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>أكاديمية العلوم التطبيقية - بوابة الألعاب والتميز</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #06080F;
            --card-bg: #0B0F19;
            --card-border: rgba(129, 140, 248, 0.2);
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --primary: #818CF8;
            --primary-dark: #6366F1;
            --accent: #06B6D4;
            --glow-color: rgba(6, 182, 212, 0.25);
        }

        body {
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(129, 140, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.08) 0%, transparent 40%);
        }

        .login-card {
            background: var(--card-bg);
            padding: 32px 24px;
            border-radius: 32px;
            border: 2px solid var(--card-border);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px var(--glow-color);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--primary));
        }

        .welcome-badge {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: var(--accent);
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
        }

        h2 {
            margin: 0 0 8px 0;
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 950;
            line-height: 1.3;
        }

        h2 span {
            color: var(--accent);
        }

        .welcome-desc {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            right: 14px;
            font-size: 18px;
            color: var(--primary);
            pointer-events: none;
        }

        input {
            width: 100%;
            padding: 14px 44px 14px 16px;
            border-radius: 16px;
            border: 1.5px solid rgba(129, 140, 248, 0.25);
            background: rgba(11, 15, 25, 0.8);
            color: var(--text-primary);
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
            background: #0B0F19;
        }

        .toggle-password {
            position: absolute;
            left: 14px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 18px;
            padding: 0;
            transition: 0.2s;
        }

        .toggle-password:hover {
            color: var(--accent);
        }

        .login-btn {
            background: linear-gradient(135deg, var(--accent) 0%, var(--primary-dark) 100%);
            color: #FFF;
            border: none;
            padding: 15px;
            border-radius: 16px;
            font-weight: 950;
            font-size: 15px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.35);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(6, 182, 212, 0.5);
            filter: brightness(1.1);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .footer-note {
            text-align: center;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="welcome-badge">
            <span>⚡</span> قاعة التحدي والمتعة
        </div>
        <h2>أهلاً بك يا بطل في <span>عالم الألعاب</span></h2>
        <p class="welcome-desc">سجل دخولك الآن لتنطلق في مغامرة تعليمية ممتعة، تحصد النقاط، وتتحدى الأصدقاء في صدارة المتصدرين!</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label>اسم المستخدم</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" placeholder="أدخل اسمك الكريم أو لقبك البطل" required autocomplete="username">
                </div>
            </div>

            <div class="input-group">
                <label>الرقم السري</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔑</span>
                    <input type="password" id="password" placeholder="أدخل الرقم السري الخاص بك" required autocomplete="current-password">
                    <button type="button" id="togglePasswordBtn" class="toggle-password" title="إظهار/إخفاء الرمز">👁️</button>
                </div>
            </div>

            <button type="submit" class="login-btn">
                <span>انطلق إلى قسم الألعاب</span>
                <span>🚀</span>
            </button>
        </form>

        <div class="footer-note">
            أكاديمية العلوم التطبيقية • جميع الحقوق محفوظة 2026
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');

        togglePasswordBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePasswordBtn.textContent = '👁️‍🗨️';
            } else {
                passwordInput.type = 'password';
                togglePasswordBtn.textContent = '👁️';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (username && password) {
                // حفظ حالة الدخول واسم المستخدم محلياً ليتطابق مع نظام المنصة
                localStorage.setItem('em_is_logged_in', 'true');
                localStorage.setItem('em_student_name', username);
                
                // الانتقال المباشر والفوري إلى صفحة الألعاب
                window.location.href = 'gaming-hub.html';
            }
        });
    </script>
</body>
</html>
