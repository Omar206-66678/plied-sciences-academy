<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Master - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0B0F19; color: #FFF; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #151D2E; padding: 24px; border-radius: 24px; border: 2px solid rgba(6, 182, 212, 0.35); width: 100%; max-width: 380px; box-sizing: border-box; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #06B6D4; margin-bottom: 20px; font-weight: 900; }
        .input-group { margin-bottom: 16px; position: relative; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #9CA3AF; }
        input { width: 100%; padding: 12px 40px 12px 12px; border-radius: 12px; border: 1.5px solid rgba(6, 182, 212, 0.3); background: #0B0F19; color: #FFF; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        .toggle-password { position: absolute; left: 12px; top: 38px; background: none; border: none; cursor: pointer; color: #9CA3AF; font-size: 16px; }
        .login-btn { background: #06B6D4; color: #0B0F19; border: none; padding: 12px; border-radius: 12px; font-weight: 900; width: 100%; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .login-btn:hover { background: #0891B2; color: #FFF; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>English Master 🚀</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسمك" required>
            </div>
            <div class="input-group">
                <label>الرقم السري</label>
                <input type="password" id="password" placeholder="أدخل الرقم السري" required>
                <button type="button" id="togglePasswordBtn" class="toggle-password">👁️</button>
            </div>
            <button type="submit" class="login-btn">دخول لروضة الألعاب ➔</button>
        </form>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');

        togglePasswordBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePasswordBtn.textContent = '👁️‍🗨️';
            } else {
                passwordInput.type = 'password';
                togglePasswordBtn.textContent = '👁️';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (username && password) {
                // حفظ حالة الدخول واسم المستخدم محلياً ليتطابق مع gaming-hub.html
                localStorage.setItem('em_is_logged_in', 'true');
                localStorage.setItem('em_student_name', username);
                
                // الانتقال مباشرة إلى صفحة الألعاب
                window.location.href = 'gaming-hub.html';
            }
        });
    </script>
</body>
</html>
