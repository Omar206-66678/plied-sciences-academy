<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>أكاديمية العلوم التطبيقية - بوابة الألعاب والتميز</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0B2A5B;
            --blue: #1A73E8;
            --pink: #F472C6;
            --sky: #8EE4FC;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            background: #FBF7FC;
            color: var(--navy);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 16px;
        }

        .login-card {
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 390px;
            min-height: 580px;
            padding: 48px 30px 34px;
            border-radius: 44px;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 100% 0%, #F472C6 0%, rgba(244,114,198,0) 58%),
                radial-gradient(circle at 100% 100%, #8EE4FC 0%, rgba(142,228,252,0) 60%),
                radial-gradient(circle at 105% 52%, #FF9F86 0%, rgba(255,159,134,0) 48%),
                linear-gradient(160deg, #FFFBF3 0%, #FFD9CE 55%, #F7EAE6 100%);
            box-shadow: 0 25px 70px rgba(244, 114, 198, 0.28), 0 0 0 1px rgba(255,255,255,0.5) inset;
        }

        /* أشكال زجاجية زخرفية */
        .glass-shape {
            position: absolute;
            pointer-events: none;
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.35) 40%, rgba(244,114,198,0.75) 80%, rgba(142,228,252,0.8) 100%);
            box-shadow: 0 10px 30px rgba(244,114,198,0.18);
        }
        .shape-1 { width: 130px; height: 130px; top: 150px; right: -34px; transform: rotate(-28deg); opacity: 0.9; }
        .shape-2 { width: 78px; height: 78px; bottom: 24px; left: 56px; transform: rotate(28deg); opacity: 0.9; border-radius: 22px; }
        .dot {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFB4A2, #F9A8D4);
            opacity: 0.85;
        }
        .dot-1 { width: 20px; height: 20px; top: 70px; right: 56px; }
        .dot-2 { width: 14px; height: 14px; top: 250px; left: 36px; }
        .dot-3 { width: 18px; height: 18px; bottom: 200px; right: 24px; }
        .dot-4 { width: 20px; height: 20px; bottom: 150px; left: 24px; }

        .card-content { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; flex: 1; }

        .hero-icon {
            width: 72px; height: 72px; margin: 0 auto 18px;
            border-radius: 24px; font-size: 34px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,255,255,0.45));
            box-shadow: 0 12px 28px rgba(244,114,198,0.35), 0 0 0 1px rgba(255,255,255,0.7) inset;
            transform: rotate(-8deg);
        }

        h2 {
            margin: 0 0 10px;
            text-align: center;
            color: var(--navy);
            font-size: 24px;
            font-weight: 900;
            line-height: 1.5;
        }

        .welcome-desc {
            margin: 0 0 32px;
            text-align: center;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.8;
            text-shadow: 0 1px 8px rgba(190, 60, 140, 0.35);
        }

        .input-group { margin-bottom: 18px; }

        .input-wrapper { position: relative; display: flex; align-items: center; }

        input {
            width: 100%;
            height: 60px;
            padding: 0 24px;
            border-radius: 40px;
            border: none;
            background: #FFFFFF;
            color: var(--navy);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 700;
            outline: none;
            box-shadow: 0 8px 20px rgba(200, 90, 150, 0.1);
            transition: box-shadow 0.25s ease;
        }
        input::placeholder { color: #B6B6BE; font-weight: 600; }
        input:focus { box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.28), 0 8px 20px rgba(200, 90, 150, 0.12); }

        #password { padding-left: 58px; }

        .toggle-password {
            position: absolute;
            left: 20px;
            width: 30px;
            height: 30px;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            color: #8C8C96;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--blue); }
        .toggle-password svg { width: 24px; height: 24px; }
        .toggle-password .eye-slash { display: block; }
        .toggle-password.shown .eye-slash { display: none; }

        .login-btn {
            width: 100%;
            height: 60px;
            margin-top: 26px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 800;
            color: var(--navy);
            background: linear-gradient(90deg, #F6ECEE 0%, #F08DB0 22%, #FCEEF0 48%, #F472C6 74%, #8EE4FC 100%);
            box-shadow: 0 14px 28px rgba(240, 120, 170, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 18px 34px rgba(240, 120, 170, 0.45); filter: brightness(1.04); }
        .login-btn:active { transform: translateY(0); }

        .footer-note {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: #6B5A66;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <span class="glass-shape shape-1"></span>
        <span class="glass-shape shape-2"></span>
        <span class="dot dot-1"></span>
        <span class="dot dot-2"></span>
        <span class="dot dot-3"></span>
        <span class="dot dot-4"></span>

        <div class="card-content">
            <div class="hero-icon">🎮</div>
            <h2>أهلاً بك يا بطل في عالم الألعاب</h2>
            <p class="welcome-desc">سجل دخولك الآن لتنطلق في مغامرة تعليمية ممتعة، تحصد النقاط، وتتحدى الأصدقاء في صدارة المتصدرين!</p>

            <form id="loginForm">
                <div class="input-group">
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="أدخل اسم المستخدم" aria-label="اسم المستخدم" required autocomplete="username">
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="الرقم السري" aria-label="الرقم السري" required autocomplete="current-password">
                        <button type="button" id="togglePasswordBtn" class="toggle-password" title="إظهار/إخفاء الرمز" aria-label="إظهار أو إخفاء الرقم السري">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/>
                                <circle cx="12" cy="12" r="3"/>
                                <line class="eye-slash" x1="4" y1="20" x2="20" y2="4"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    <span>انطلق إلى قسم الألعاب</span>
                    <span>🚀</span>
                </button>
            </form>
            <div class="footer-note">أكاديمية العلوم التطبيقية • جميع الحقوق محفوظة 2026</div>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');

        togglePasswordBtn.addEventListener('click', () => {
            const show = passwordInput.type === 'password';
            passwordInput.type = show ? 'text' : 'password';
            togglePasswordBtn.classList.toggle('shown', show);
        });

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (username && password) {
                // حفظ حالة الدخول واسم المستخدم محلياً ليتطابق مع نظام المنصة
                localStorage.setItem('em_is_logged_in', 'true');
                localStorage.setItem('em_student_name', username);

                // الانتقال المباشر والفوري إلى صفحة الألعاب
                window.location.href = 'gaming-hub.html';
            }
        });
    </script>
</body>
</html>
