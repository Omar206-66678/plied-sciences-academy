<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>English Master - مطابقة الأزواج الذكية</title>
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
        
        <script>
            let currentSavedTheme = localStorage.getItem("em_theme");
            if (currentSavedTheme === "light") {
                document.documentElement.classList.add("light-mode");
            } else {
                document.documentElement.classList.add("dark-mode");
            }

            function toggleTheme() {
                let isLight = document.documentElement.classList.toggle("light-mode");
                document.documentElement.classList.toggle("dark-mode");
                localStorage.setItem("em_theme", isLight ? "light" : "dark");
                updateThemeIcon(!isLight);
            }

            function updateThemeIcon(isDark) {
                let btn = document.getElementById("themeIconBtn");
                if (btn) {
                    btn.innerHTML = isDark ? "☀️" : "🌙";
                }
            }

            const ranksList = [
                { level: 1, name: "هاوي", xpRequired: 100, badge: "🌱", desc: "بداية" },
                { level: 2, name: "مبتدئ", xpRequired: 300, badge: "⚙️", desc: "تأسيس" },
                { level: 3, name: "متدرب", xpRequired: 600, badge: "🔑", desc: "انطلاق" },
                { level: 4, name: "مستكشف", xpRequired: 1000, badge: "🧩", desc: "تقدم" },
                { level: 5, name: "محترف", xpRequired: 1500, badge: "🛡️", desc: "ثبات" },
                { level: 6, name: "خبير", xpRequired: 2200, badge: "⚔️", desc: "إتقان" },
                { level: 7, name: "صقر اللغات", xpRequired: 3000, badge: "🦅", desc: "احتراف" },
                { level: 8, name: "فنان القواعد", xpRequired: 4000, badge: "💎", desc: "براعة" },
                { level: 9, name: "بطل اسطوري", xpRequired: 5500, badge: "👑", desc: "سيادة" },
                { level: 10, name: "إمبراطور الإنجليزية", xpRequired: 7500, badge: "🌟", desc: "أسطورة" }
            ];

            function getUserRank(score) {
                let current = ranksList[0];
                for (let i = 0; i < ranksList.length; i++) {
                    if (score >= ranksList[i].xpRequired) {
                        current = ranksList[i];
                    }
                }
                return current;
            }
        </script>
        <style>
            :root, html.dark-mode {
                --bg-main: #0B0F19;
                --card-bg: linear-gradient(135deg, rgba(21, 29, 46, 0.92) 0%, rgba(15, 23, 42, 0.95) 100%);
                --text-main: #FFFFFF;
                --text-muted: #9CA3AF;
                --accent-primary: #10B981;
                --neon-cyan: #06B6D4;
                --neon-green: #10B981;
                --neon-amber: #F59E0B;
                --neon-rose: #F43F5E;
                --border-line: 2px solid rgba(16, 185, 129, 0.35);
                --card-border-glow: 2px solid rgba(16, 185, 129, 0.35);
                --card-glow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(16, 185, 129, 0.1);
                --glass-blur: blur(25px);
                --stat-pill-bg: rgba(16, 185, 129, 0.06);
            }

            html.light-mode {
                --bg-main: #F1F5F9;
                --card-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 250, 252, 0.98) 100%);
                --text-main: #0F172A;
                --text-muted: #64748B;
                --accent-primary: #059669;
                --neon-cyan: #0891B2;
                --neon-green: #059669;
                --neon-amber: #D97706;
                --neon-rose: #E11D48;
                --border-line: 2px solid rgba(5, 150, 105, 0.3);
                --card-border-glow: 2px solid rgba(5, 150, 105, 0.3);
                --card-glow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 0 25px rgba(5, 150, 105, 0.08);
                --glass-blur: blur(25px);
                --stat-pill-bg: rgba(5, 150, 105, 0.04);
            }

            body {
                background: var(--bg-main);
                color: var(--text-main);
                font-family: 'Cairo', sans-serif;
                margin: 0;
                min-height: 100vh;
                padding: 16px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                align-items: stretch;
                transition: background 0.4s ease, color 0.4s ease;
                background-image: 
                    radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.12) 0%, transparent 40%),
                    radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
            }

            .container { 
                max-width: 600px; 
                width: 100%; 
                margin: auto; 
                display: flex;
                flex-direction: column;
                flex: 1;
            }

            #gamePlayArea, #summaryArea {
                display: flex;
                flex-direction: column;
                flex: 1;
            }

            .arena-panel {
                background: var(--card-bg);
                backdrop-filter: var(--glass-blur);
                -webkit-backdrop-filter: var(--glass-blur);
                border: var(--card-border-glow);
                border-radius: 32px;
                padding: 24px;
                box-shadow: var(--card-glow);
                text-align: center;
                display: flex;
                flex-direction: column;
                flex: 1;
                position: relative;
                overflow: hidden;
            }

            .arena-panel::before {
                content: '';
                position: absolute;
                top: 0; left: 0; right: 0;
                height: 1.5px;
                background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.6), transparent);
            }

            .integrated-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding-bottom: 16px;
                border-bottom: var(--border-line);
                margin-bottom: 16px;
                gap: 8px;
                flex-shrink: 0;
            }

            .header-group-right, .header-group-left {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .nav-close-btn, .theme-toggle-btn {
                background: var(--stat-pill-bg);
                border: 1.5px solid rgba(16, 185, 129, 0.3);
                color: var(--text-main);
                width: 38px;
                height: 38px;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                text-decoration: none;
                transition: all 0.2s ease;
                flex-shrink: 0;
                backdrop-filter: blur(8px);
                font-size: 15px;
            }
            .nav-close-btn:hover, .theme-toggle-btn:hover {
                background: rgba(16, 185, 129, 0.15);
                border-color: var(--neon-green);
                color: var(--neon-green);
            }
            
            .stat-pill {
                display: flex;
                align-items: center;
                gap: 4px;
                background: var(--stat-pill-bg);
                border: 1.5px solid rgba(16, 185, 129, 0.3);
                padding: 6px 10px;
                border-radius: 12px;
                font-weight: 900;
                font-size: 11px;
                backdrop-filter: blur(8px);
                white-space: nowrap;
            }

            .stat-pill.streak { color: var(--neon-rose); }
            .stat-pill.gems { color: var(--neon-cyan); }
            .stat-pill.xp { color: var(--neon-amber); }
            
            .stat-pill.rank-bar { 
                color: #10B981; 
                border-color: rgba(16, 185, 129, 0.5); 
                background: rgba(16, 185, 129, 0.12); 
                cursor: pointer;
                transition: all 0.2s ease;
                width: 100%;
                justify-content: center;
                padding: 10px;
                border-radius: 14px;
                font-size: 14px;
                box-sizing: border-box;
                margin-bottom: 16px;
            }
            .stat-pill.rank-bar:hover {
                background: rgba(16, 185, 129, 0.25);
                transform: translateY(-2px);
            }

            .instruction-box {
                background: rgba(16, 185, 129, 0.08);
                border: 1.5px solid rgba(16, 185, 129, 0.3);
                border-radius: 16px;
                padding: 12px 18px;
                font-size: 14px;
                font-weight: 800;
                color: var(--neon-green);
                margin-bottom: 20px;
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }

            /* عمودين: اليمين إنجليزي مع مايك، اليسار عربي */
            .matching-columns-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
                margin-bottom: 20px;
            }

            .column-side {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .match-card {
                background: var(--stat-pill-bg);
                border: 1.5px solid rgba(16, 185, 129, 0.3);
                color: var(--text-main);
                padding: 14px 12px;
                border-radius: 16px;
                font-size: 14px;
                font-weight: 900;
                cursor: pointer;
                text-align: center;
                transition: all 0.2s;
                user-select: none;
                backdrop-filter: blur(8px);
                min-height: 55px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                box-sizing: border-box;
            }
            .match-card:hover { border-color: var(--neon-green); background: rgba(16, 185, 129, 0.15); transform: translateY(-2px); }
            .match-card.selected { background: rgba(16, 185, 129, 0.3); border-color: var(--neon-green); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
            .match-card.matched { opacity: 0.25; pointer-events: none; border-color: var(--text-muted); }

            .audio-wave-box {
                display: flex;
                align-items: center;
                gap: 6px;
                color: var(--neon-cyan);
                font-size: 13px;
                direction: ltr;
            }
            .wave-bars {
                display: flex;
                align-items: center;
                gap: 2px;
            }
            .wave-bars span {
                display: block;
                width: 3px;
                height: 12px;
                background: var(--neon-cyan);
                border-radius: 2px;
            }
            .wave-bars span:nth-child(2) { height: 18px; }
            .wave-bars span:nth-child(3) { height: 10px; }

            .summary-card {
                background: var(--stat-pill-bg);
                border: 1.5px solid rgba(16, 185, 129, 0.3);
                border-radius: 20px;
                padding: 24px;
                text-align: center;
                margin: auto 0;
            }

            .summary-title { font-size: 20px; font-weight: 900; margin-bottom: 14px; color: var(--text-main); }
            .summary-stat { font-size: 14px; font-weight: 800; margin: 8px 0; color: var(--text-muted); }

            .back-menu-action {
                width: 100%;
                background: var(--neon-green);
                color: #FFF;
                border: none;
                padding: 14px;
                border-radius: 16px;
                font-weight: 900;
                font-size: 14px;
                cursor: pointer;
                transition: all 0.2s;
                margin-top: 16px;
                display: block;
                text-decoration: none;
                text-align: center;
                box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
            }
            .back-menu-action:hover { opacity: 0.9; }

            .modal-overlay {
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(11, 15, 25, 0.9);
                backdrop-filter: blur(15px);
                display: none;
                justify-content: center;
                align-items: center;
                z-index: 2000;
                padding: 16px;
            }

            .modal-content {
                background: #111827;
                border: 1.5px solid rgba(16, 185, 129, 0.3);
                border-radius: 32px;
                width: 100%;
                max-width: 480px;
                max-height: 85vh;
                display: flex;
                flex-direction: column;
                padding: 24px;
                box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            }

            .modal-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid rgba(255,255,255,0.08);
                padding-bottom: 16px;
                margin-bottom: 16px;
            }

            .modal-header h3 { margin: 0; color: #FFF; font-size: 18px; font-weight: 900; }
            .close-modal-btn { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }

            .dict-scroll-area {
                overflow-y: auto;
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 12px;
                padding-left: 4px;
            }

            .rank-item-card {
                background: #1F2937;
                border: 1px solid rgba(255, 255, 255, 0.05);
                border-radius: 16px;
                padding: 14px 18px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .rank-item-card.completed { border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.06); }
            .rank-item-card.current { border-color: var(--neon-green); background: rgba(16, 185, 129, 0.12); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
            .rank-item-card.locked { opacity: 0.65; }

            .rank-info-right { display: flex; align-items: center; gap: 12px; }
            .rank-badge-box { font-size: 24px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border-radius: 10px; }
            .rank-text-detail h4 { margin: 0 0 4px 0; font-size: 14px; font-weight: 900; color: #FFF; }
            .rank-text-detail p { margin: 0; font-size: 11px; color: var(--text-muted); font-weight: 700; }
            .rank-status-left { font-size: 12px; font-weight: 900; text-align: left; }
            .status-done { color: var(--neon-green); }
            .status-current { color: var(--neon-amber); }
            .status-lock { color: var(--text-muted); }
        </style>

        <script>
            const matchingPairsBank = {
                1: [
                    { id: 101, en: "Speak", ar: "يتحدث" },
                    { id: 102, en: "School", ar: "مدرسة" },
                    { id: 103, en: "Car", ar: "سيارة" },
                    { id: 104, en: "Book", ar: "كتاب" }
                ]
            };
        </script>
    </head>
    <body>

        <div class="container">
            <!-- شاشة اللعب النشطة -->
            <div id="gamePlayArea">
                <div class="arena-panel">
                    
                    <!-- شريط الهيدرو العلوي -->
                    <div class="integrated-header">
                        <div class="header-group-right">
                            <a href="gaming-hub.html" class="nav-close-btn" title="خروج لساحة الألعاب">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                            </a>
                            <div class="stat-pill gems">💎 <span id="gemsDisplay">50</span></div>
                            <div class="stat-pill streak">🔥 <span id="streakDisplay">0</span></div>
                        </div>

                        <div class="header-group-left">
                            <div class="stat-pill xp">⚡ <span id="scoreDisplay">0</span></div>
                            <button id="themeIconBtn" class="theme-toggle-btn" onclick="toggleTheme()" title="تبديل الثيم">🌙</button>
                        </div>
                    </div>

                    <!-- شريط المستوى -->
                    <div class="stat-pill rank-bar" id="heroRankDisplay" onclick="openRanksModal()" title="اضغط لعرض مسار المستويات">
                        🌱 Lv.1 هاوي (بداية)
                    </div>

                    <!-- كارت الإرشادات -->
                    <div class="instruction-box">
                        <span>🔄 اضغط على الأزواج المتطابقة (إنجليزي يمين وعربي شمال):</span>
                    </div>

                    <!-- عمودين: إنجليزي يمين وعربي شمال -->
                    <div class="matching-columns-container">
                        <div class="column-side" id="englishColumn"></div>
                        <div class="column-side" id="arabicColumn"></div>
                    </div>
                </div>
            </div>

            <!-- تقرير الأداء الختامي -->
            <div id="summaryArea" style="display: none;">
                <div class="arena-panel">
                    <div class="summary-card">
                        <div class="summary-title" id="summaryHeader">🎉 مبروك، أنهيت جولة المطابقة بنجاح!</div>
                        <div class="summary-stat" id="finalScoreStat">النقاط المكتسبة: +0 XP</div>
                        <div class="summary-stat" id="finalGemsStat">الجواهر المكتسبة: 💎 +5</div>
                    </div>
                    <a href="gaming-hub.html" class="back-menu-action">🏠 العودة لساحة الألعاب</a>
                </div>
            </div>
        </div>

        <!-- نافذة عرض قائمة المستويات المنبثقة -->
        <div id="ranksModal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>🏆 مسار الرتب والمستويات العشرة</h3>
                    <button class="close-modal-btn" onclick="closeRanksModal()">✕</button>
                </div>
                <div class="dict-scroll-area" id="ranksContainer"></div>
            </div>
        </div>

        <script>
            let globalScore = parseInt(localStorage.getItem("em_game_score")) || 0;
            let globalGems = parseInt(localStorage.getItem("em_game_gems")) || 50;
            let globalStreak = parseInt(localStorage.getItem("em_game_streak")) || 0;

            let roundScore = 0;
            let roundGems = 0;
            let streak = globalStreak;
            let selectedPair = null;
            let matchedPairsCount = 0;

            const currentPairs = matchingPairsBank[1];

            function speakText(text) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    let utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    window.speechSynthesis.speak(utterance);
                }
            }

            function updateHUD() {
                let rankData = getUserRank(globalScore + roundScore);
                document.getElementById("scoreDisplay").innerText = globalScore + roundScore;
                document.getElementById("gemsDisplay").innerText = globalGems + roundGems;
                document.getElementById("streakDisplay").innerText = streak;
                document.getElementById("heroRankDisplay").innerText = `${rankData.badge} Lv.${rankData.level} ${rankData.name} (${rankData.desc})`;
            }

            function loadMatchingGrid() {
                updateHUD();
                let englishCol = document.getElementById("englishColumn");
                let arabicCol = document.getElementById("arabicColumn");
                englishCol.innerHTML = "";
                arabicCol.innerHTML = "";

                let englishDeck = [];
                let arabicDeck = [];

                currentPairs.forEach((p) => {
                    englishDeck.push({ text: p.en, pairId: p.id, type: 'en' });
                    arabicDeck.push({ text: p.ar, pairId: p.id, type: 'ar' });
                });

                englishDeck.sort(() => Math.random() - 0.5);
                arabicDeck.sort(() => Math.random() - 0.5);

                // عمود الإنجليزي (يمين)
                englishDeck.forEach(item => {
                    let card = document.createElement("div");
                    card.className = "match-card";
                    card.dataset.pairId = item.pairId;
                    card.dataset.type = item.type;
                    card.innerHTML = `
                        <span style="font-family: sans-serif; direction: ltr;">${item.text}</span>
                        <div class="audio-wave-box" onclick="event.stopPropagation(); speakText('${item.text}')" title="استماع النطق">
                            <div class="wave-bars">
                                <span></span><span></span><span></span>
                            </div>
                            <span>🔊</span>
                        </div>
                    `;

                    card.onclick = () => handleCardClick(card);
                    englishCol.appendChild(card);
                });

                // عمود العربي (يسار)
                arabicDeck.forEach(item => {
                    let card = document.createElement("div");
                    card.className = "match-card";
                    card.dataset.pairId = item.pairId;
                    card.dataset.type = item.type;
                    card.innerHTML = `<span style="width: 100%; text-align: center;">${item.text}</span>`;

                    card.onclick = () => handleCardClick(card);
                    arabicCol.appendChild(card);
                });
            }

            function handleCardClick(card) {
                if (card.classList.contains("matched") || card.classList.contains("selected")) return;

                if (!selectedPair) {
                    selectedPair = card;
                    card.classList.add("selected");
                    if(card.dataset.type === 'en') {
                        let textSpan = card.querySelector('span');
                        if(textSpan) speakText(textSpan.innerText);
                    }
                } else {
                    let first = selectedPair;
                    let second = card;

                    // يجب أن يكون الكارتين من نفس الـ pairId ولكن مختلفين في النوع (واحد إنجليزي والثاني عربي)
                    if (first.dataset.pairId === second.dataset.pairId && first.dataset.type !== second.dataset.type) {
                        first.classList.remove("selected");
                        first.classList.add("matched");
                        second.classList.add("matched");
                        selectedPair = null;

                        streak++;
                        roundScore += 10;
                        matchedPairsCount++;
                        updateHUD();
                        confetti({ particleCount: 50, spread: 40, origin: { y: 0.6 } });

                        if (matchedPairsCount === currentPairs.length) {
                            roundGems += 5;
                            localStorage.setItem("em_game_score", globalScore + roundScore);
                            localStorage.setItem("em_game_gems", globalGems + roundGems);
                            if (streak > globalStreak) localStorage.setItem("em_game_streak", streak);

                            setTimeout(() => {
                                document.getElementById("gamePlayArea").style.display = "none";
                                document.getElementById("summaryArea").style.display = "flex";
                                document.getElementById("finalScoreStat").innerText = `النقاط المكتسبة: +${roundScore} XP`;
                                document.getElementById("finalGemsStat").innerText = `الجواهر المكتسبة: 💎 +${roundGems}`;
                            }, 600);
                        }
                    } else {
                        first.classList.add("selected");
                        second.classList.add("selected");
                        streak = 0;
                        updateHUD();

                        setTimeout(() => {
                            first.classList.remove("selected");
                            second.classList.remove("selected");
                            selectedPair = null;
                        }, 500);
                    }
                }
            }

            function openRanksModal() {
                let container = document.getElementById("ranksContainer");
                container.innerHTML = "";
                let currentScore = globalScore + roundScore;

                ranksList.forEach(r => {
                    let card = document.createElement("div");
                    let statusHtml = "";
                    let cardClass = "rank-item-card";

                    if (currentScore >= r.xpRequired) {
                        cardClass += " completed";
                        statusHtml = `<span class="status-done">✔ مكتمل</span>`;
                    } else if (currentScore >= (ranksList[r.level - 2] ? ranksList[r.level - 2].xpRequired : 0) && currentScore < r.xpRequired) {
                        cardClass += " current";
                        let needed = r.xpRequired - currentScore;
                        statusHtml = `<span class="status-current">المستوى الحالي<br><small style="color:var(--text-main)">متبقي ${needed} XP</small></span>`;
                    } else {
                        cardClass += " locked";
                        let needed = r.xpRequired - currentScore;
                        statusHtml = `<span class="status-lock">🔒 مقفل<br><small>مطلوب ${needed}+ XP</small></span>`;
                    }

                    card.className = cardClass;
                    card.innerHTML = `
                        <div class="rank-info-right">
                            <div class="rank-badge-box">${r.badge}</div>
                            <div class="rank-text-detail">
                                <h4>Lv.${r.level} - ${r.name} (${r.desc})</h4>
                                <p>الحد الأدنى: ${r.xpRequired} نقطة XP</p>
                            </div>
                        </div>
                        <div class="rank-status-left">${statusHtml}</div>
                    `;
                    container.appendChild(card);
                });

                document.getElementById("ranksModal").style.display = "flex";
            }

            function closeRanksModal() {
                document.getElementById("ranksModal").style.display = "none";
            }

            window.addEventListener("DOMContentLoaded", () => {
                loadMatchingGrid();
            });
        </script>
    </body>
</html>
